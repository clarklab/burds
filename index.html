<html lang="en">
<head>

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#5ec8e0" />
  <title>Burds — a game about bird turds</title>
  <meta name="description" content="Be a seagull. Drop bombs on the boardwalk. ~30 seconds a round." />

  <!-- Link unfurl / social card (Open Graph + Twitter). Swap the domain below
       if you point a custom domain at the game. -->

  <meta property="og:site_name" content="Burds" />

  <meta property="og:image" content="https://burds-game.netlify.app/unfurl.webp" />
  <meta property="og:image:type" content="image/webp" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="706" />
  <meta property="og:image:alt" content="A low-poly seagull dropping a turd onto a bullseye on a sunny beach, beside the gold BURDS logo." />

  <meta name="twitter:title" content="Burds — a game about bird turds" />
  <meta name="twitter:description" content="Be a seagull. Drop bombs on the boardwalk. ~30 seconds a round." />

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="./favicon-48.png" />
  <link rel="icon" type="image/webp" sizes="192x192" href="./icon-192.webp" />

  {
    "imports": {
      "three": "./vendor/three.module.js"
    }

  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- In-game HUD -->
  <div id="hud" class="hidden">
    <div class="hud-top">
      <div class="hud-pill" id="scorePill">
        <span class="hud-label">SCORE</span>
        <span class="hud-value" id="scoreValue">0</span>
      </div>
      <div class="hud-pill" id="comboPill">
        <span class="hud-value" id="comboValue"></span>
      </div>
      <div class="hud-pill" id="timerPill">
        <span class="hud-label">TIME</span>
        <span class="hud-value" id="timerValue">30</span>
      </div>
    </div>

    <div id="hitToast" class="hidden"></div>

    <!-- Blinking "TURD CAM" callout shown during bullet-time -->
    <div id="turdCam" class="hidden"><span class="dot"></span>TURD CAM</div>

    <!-- Golden "SUPER TURD" countdown badge, shown while super mode is active -->
    <div id="superBadge" class="hidden"><span class="bolt" id="superBolt"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" stroke="none" d="M13 2L4 13.5h5.5L8.5 22 20 9.5h-5.8z"/></svg></span><span id="superLabel">SUPER TURD</span><span id="superMult">×1.5</span><span id="superTime">15</span>s</div>

    <!-- Tier-3 weapon picker — slow-mo menu shown on the 3rd super stack -->
    <div id="weaponPicker" class="hidden">
      <div class="wp-title">PICK YOUR TURD</div>
      <div class="wp-row">
        <button class="wp-btn" data-mode="fire" aria-label="Fire Turd">
          <span class="wp-ic"><svg class="ic" viewBox="0 0 24 24" width="40" height="40" aria-hidden="true"><path fill="currentColor" stroke="none" d="M12 2.5c2.6 3.4 5.2 5.5 5.2 9.4A5.2 5.2 0 0 1 6.8 12c0-1.9.9-3.4 2-4.8.2 1 .9 1.7 1.8 1.7C9.4 6.9 10.4 5 12 2.5z"/></svg></span>
          <span class="wp-name">FIRE</span>
        </button>
        <button class="wp-btn" data-mode="scatter" aria-label="Scatter Turd">
          <span class="wp-ic"><svg class="ic" viewBox="0 0 24 24" width="40" height="40" aria-hidden="true"><circle cx="12" cy="20" r="1.7" fill="currentColor" stroke="none"/><line x1="12" y1="18.5" x2="6" y2="6"/><line x1="12" y1="18.5" x2="12" y2="5"/><line x1="12" y1="18.5" x2="18" y2="6"/><circle cx="6" cy="4.6" r="1.7" fill="currentColor" stroke="none"/><circle cx="12" cy="3.6" r="1.7" fill="currentColor" stroke="none"/><circle cx="18" cy="4.6" r="1.7" fill="currentColor" stroke="none"/></svg></span>
          <span class="wp-name">SCATTER</span>
        </button>
        <button class="wp-btn" data-mode="machinegun" aria-label="Machine Gun Turd">
          <span class="wp-ic"><svg class="ic" viewBox="0 0 24 24" width="40" height="40" aria-hidden="true"><line x1="3" y1="8.5" x2="15" y2="8.5"/><line x1="3" y1="14" x2="12" y2="14"/><circle cx="19" cy="8.5" r="1.8" fill="currentColor" stroke="none"/><circle cx="16" cy="14" r="1.8" fill="currentColor" stroke="none"/><circle cx="9" cy="19" r="1.8" fill="currentColor" stroke="none"/><line x1="3" y1="19" x2="6" y2="19"/></svg></span>
          <span class="wp-name">MACHINE&nbsp;GUN</span>
        </button>
      </div>
      <div class="wp-sub">+20s &amp; giant turds</div>
    </div>

    <!-- Poop / bomb button -->
    <button id="poopBtn" aria-label="Poop">
      <svg class="charge-ring" viewBox="0 0 120 120">
        <circle class="charge-bg" cx="60" cy="60" r="54" />
        <circle class="charge-fg" cx="60" cy="60" r="54" />
      </svg>
      <span class="poop-emoji"><svg class="ic" viewBox="0 0 24 24" width="52" height="52" aria-hidden="true"><path fill="currentColor" stroke="none" d="M10.8 4.1c1.5-.6 3.2.5 3.2 2 0 .3-.1.6-.2.9 1.8-.1 3.3 1 3.3 2.5 0 .5-.2 1-.5 1.4 1.6.4 2.8 1.5 2.8 2.9 0 .5-.2 1-.5 1.4 1.1.4 1.8 1.3 1.8 2.4 0 1.7-1.7 2.4-4.2 2.4H5.5c-2.5 0-4.2-.7-4.2-2.4 0-1.1.7-2 1.8-2.4-.3-.4-.5-.9-.5-1.4 0-1.4 1.2-2.5 2.8-2.9-.3-.4-.5-.9-.5-1.4 0-1.5 1.5-2.6 3.3-2.5-.1-.3-.2-.6-.2-.9 0-1.1.8-2 2-2.3z"/></svg></span>
    </button>
  </div>

  <!-- Start screen -->
  <div id="menu" class="overlay">
    <div class="overlay-card">
      <div class="logo-stage" id="logoStage">
        <img class="logo" src="./logo.webp" width="900" height="483" alt="BURDS — a game about bird turds" />
      </div>
      <div class="level-pick" id="levelPick"></div>
      <div class="how-to" id="howTo"></div>
      <button id="playBtn" class="big-btn" disabled>LOADING…</button>
      <p class="best-line">Best: <span id="menuBest">0</span></p>
      <div class="board" id="menuBoard">
        <div class="board-title" id="menuBoardTitle"><svg class="ic title-ic" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M7 4h10v3.5a5 5 0 0 1-10 0z"/><path d="M7 5.2H4v1.3A3.5 3.5 0 0 0 7.5 10"/><path d="M17 5.2h3v1.3A3.5 3.5 0 0 1 16.5 10"/><line x1="12" y1="12.5" x2="12" y2="16.5"/><path d="M8.3 20.5a3.7 3.7 0 0 1 7.4 0z"/></svg><span>Global Top</span></div>
        <ol class="board-list" id="menuBoardList"></ol>
      </div>
    </div>
  </div>

  <!-- Game over screen -->
  <div id="gameover" class="overlay hidden">
    <div class="overlay-card">
      <h1 class="go-title" id="goTitle">TIME'S UP!</h1>
      <div class="final-score" id="finalScore">0</div>
      <p class="final-label">points</p>
      <div class="best-chip" id="goBestChip">
        <svg class="ic title-ic" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M7 4h10v3.5a5 5 0 0 1-10 0z"/><path d="M7 5.2H4v1.3A3.5 3.5 0 0 0 7.5 10"/><path d="M17 5.2h3v1.3A3.5 3.5 0 0 1 16.5 10"/><line x1="12" y1="12.5" x2="12" y2="16.5"/><path d="M8.3 20.5a3.7 3.7 0 0 1 7.4 0z"/></svg>
        <span class="bc-label" id="goBestLabel">BEST</span>
        <b id="goBest">0</b>
      </div>
      <div class="go-stats">
        <div class="go-stat"><span id="goHits">0</span><label>splats</label></div>
        <div class="go-stat"><span id="goBullseyes">0</span><label>bullseyes</label></div>
        <div class="go-stat"><span id="goCombo">0</span><label>top combo</label></div>
      </div>
      <p class="go-blurb" id="goBlurb"></p>
      <div class="board" id="goBoard">
        <div class="board-title"><svg class="ic title-ic" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M7 4h10v3.5a5 5 0 0 1-10 0z"/><path d="M7 5.2H4v1.3A3.5 3.5 0 0 0 7.5 10"/><path d="M17 5.2h3v1.3A3.5 3.5 0 0 1 16.5 10"/><line x1="12" y1="12.5" x2="12" y2="16.5"/><path d="M8.3 20.5a3.7 3.7 0 0 1 7.4 0z"/></svg><span>Global High Scores</span></div>
        <div class="name-row">
          <input id="nameInput" maxlength="12" placeholder="YOUR NAME" autocomplete="off" spellcheck="false" />
          <button id="submitScoreBtn" class="mini-btn">SUBMIT</button>
        </div>
        <ol class="board-list" id="goBoardList"></ol>
      </div>
      <button id="againBtn" class="big-btn">PLAY AGAIN</button>
      <button id="menuBtn" class="ghost-btn"><svg class="ic btn-ic" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><line x1="20" y1="12" x2="5" y2="12"/><path d="M11 6l-6 6 6 6"/></svg><span>PICK A LEVEL</span></button>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>

  <!-- Offline support + auto-update ("JS buster"). Once you've loaded the
       game, the service worker keeps it playable with no network. When you're
       back online it quietly checks sw.js, and if a new build shipped it
       swaps in and reloads onto it. -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const reg = await navigator.serviceWorker.register('./sw.js');

          // Nudge a worker that already finished installing and is just sitting
          // in "waiting" (e.g. an earlier visit installed it but never took
          // over). This is the case that otherwise leaves players stuck on an
          // old build until every tab is closed.
          if (reg.waiting && navigator.serviceWorker.controller) {
            reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          }

          // A new worker installed while an old one is in control => a fresh
          // build is waiting. Tell it to take over right away.
          reg.addEventListener('updatefound', () => {
            const sw = reg.installing;
            if (!sw) return;
            sw.addEventListener('statechange', () => {
              if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                sw.postMessage({ type: 'SKIP_WAITING' });
              }
            });
          });

          // Actively check for a new build on this load too (not just on
          // focus/online), so a fresh deploy is picked up promptly.
          reg.update().catch(() => {});

          // When a new worker takes control, get onto the new build — with
          // two guards that used to cause phantom reloads:
          //  * first install: claim() fires controllerchange on the very first
          //    visit, but those assets just came from the network — reloading
          //    only flashed the intro twice. Skip it.
          //  * mid-game: never yank a live round (or the game-over screen)
          //    out from under the player; defer until the menu is next shown
          //    (main.js checks __swReloadPending there).
          const hadController = !!navigator.serviceWorker.controller;
          let reloaded = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (reloaded || !hadController) return;
            const st = window.game && window.game.state;
            if (st === 'playing' || st === 'gameover') { window.__swReloadPending = true; return; }
            reloaded = true;
            window.location.reload();
          });

          // Re-check for a new build whenever we regain connectivity or focus.
          const checkForUpdate = () => reg.update().catch(() => {});
          window.addEventListener('online', checkForUpdate);
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') checkForUpdate();
          });
        } catch (err) {
          // Offline-first is best-effort; the game still runs without it.
          console.warn('Service worker registration failed:', err);
        }
      });
    }
  </script>
</body>
</html>
